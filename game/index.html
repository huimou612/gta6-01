<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmar — an open-world crime story</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0e1420;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; color: #fff; }
  #game { position: fixed; inset: 0; }
  #game canvas { display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; }
  #hud.playing #hud-top-left, #hud.playing #hud-top-right, #hud.playing #objective,
  #hud.playing #hud-bottom-left { display: block; }
  #hud-top-left { display: none; position: absolute; top: 16px; left: 16px; }
  .hud-label { font-size: 11px; letter-spacing: 2px; color: #ffffffaa; margin-right: 8px; }
  #health-bar { display: inline-block; width: 170px; height: 12px; background: #00000088;
    border: 1px solid #ffffff55; border-radius: 6px; overflow: hidden; vertical-align: middle; }
  #health-fill { height: 100%; width: 100%; background: #4caf50; }
  #money-row { margin-top: 8px; font-size: 22px; font-weight: 700; color: #7ee787;
    text-shadow: 0 1px 3px #000; }
  #stars-row { margin-top: 4px; font-size: 22px; letter-spacing: 3px; text-shadow: 0 1px 3px #000; }
  #hud-top-right { display: none; position: absolute; top: 16px; right: 16px; }
  #minimap { border: 2px solid #ffffff66; border-radius: 8px; background: #1d2b1d;
    box-shadow: 0 2px 10px #00000088; }
  #objective { display: none; position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
    background: #00000099; padding: 8px 18px; border-radius: 20px; font-size: 15px;
    border: 1px solid #ffd23a55; white-space: nowrap; max-width: 90vw; overflow: hidden;
    text-overflow: ellipsis; }
  #dialogue { position: absolute; bottom: 110px; left: 50%; transform: translateX(-50%);
    width: min(640px, 86vw); background: #000000cc; border-left: 4px solid #ffd23a;
    padding: 12px 16px; border-radius: 6px; font-size: 16px; line-height: 1.45;
    opacity: 0; transition: opacity .3s; }
  #dialogue.visible { opacity: 1; }
  #toast { position: absolute; top: 64px; left: 50%; transform: translateX(-50%);
    background: #ffd23a; color: #1a1a1a; font-weight: 700; padding: 8px 18px; border-radius: 20px;
    font-size: 15px; opacity: 0; transition: opacity .3s; white-space: nowrap; }
  #toast.visible { opacity: 1; }
  #hud-bottom-left { display: none; position: absolute; bottom: 18px; left: 18px; }
  #speed { font-size: 30px; font-weight: 800; text-shadow: 0 2px 4px #000; }
  #ammo { font-size: 16px; font-weight: 700; color: #ffd23a; text-shadow: 0 1px 3px #000; margin-top: 2px; }
  #crosshair { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    font-size: 22px; color: #ffffffcc; text-shadow: 0 0 4px #000; }
  #damage-flash { position: absolute; inset: 0; background: #ff2020; opacity: 0;
    transition: opacity .15s; pointer-events: none; }
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; background: linear-gradient(180deg, #0e1420dd, #1a2a44cc);
    pointer-events: auto; text-align: center; padding: 20px; }
  .screen.hidden { display: none; }
  .screen h1 { font-size: 72px; letter-spacing: 14px; color: #ffd23a;
    text-shadow: 0 4px 0 #b8860b, 0 8px 24px #000; }
  .tagline { font-size: 18px; color: #cfe8ff; margin-top: 6px; letter-spacing: 2px; }
  .story { max-width: 560px; margin: 18px 0; font-size: 16px; line-height: 1.6; color: #e8e8e8; }
  .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 28px; text-align: left;
    font-size: 14px; color: #d8d8d8; margin-bottom: 22px; }
  .controls b { color: #ffd23a; }
  .screen button { pointer-events: auto; cursor: pointer; font-size: 18px; font-weight: 800;
    letter-spacing: 2px; color: #1a1a1a; background: #ffd23a; border: none; border-radius: 8px;
    padding: 14px 34px; margin: 6px; box-shadow: 0 4px 0 #b8860b; }
  .screen button:hover { background: #ffe27a; }
  .screen button.hidden { display: none; }
  .hint { margin-top: 14px; font-size: 13px; color: #ffffff88; }
  #mission-list { width: min(560px, 90vw); text-align: left; margin: 10px 0 18px; }
  .mission-item { background: #00000066; border: 1px solid #ffffff33; border-radius: 8px;
    padding: 12px 16px; margin-bottom: 10px; }
  .mission-item.done { border-color: #4caf50; }
  .mission-name { font-size: 17px; font-weight: 700; color: #ffd23a; }
  .mission-desc { font-size: 14px; color: #ddd; margin-top: 4px; line-height: 1.45; }
  .mission-state { font-size: 12px; letter-spacing: 1px; color: #ffffff99; margin-top: 6px; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.min.js"
  }
}
</script>
</head>
<body>
<div id="game"></div>
<div id="hud"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
